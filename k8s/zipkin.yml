apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zipkin
spec:
  selector:
    matchLabels:
      app: zipkin
  serviceName: zipkin-service
  replicas: 1
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
      - name: zipkin
        image: openzipkin/zipkin
        resources:
          limits:
            memory: "400Mi"
            cpu: "100m"
          requests:
            memory: "200Mi"
            cpu: "50m"
        ports:
        - containerPort: 9411
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9411
          initialDelaySeconds: 300
          periodSeconds: 20
          timeoutSeconds: 20 


---

apiVersion: v1
kind: Service
metadata:
  name: zipkin
spec:
  selector:
    app: zipkin
  ports:
  - port: 9411
    targetPort: 9411