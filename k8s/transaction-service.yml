apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
spec:
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: chandrakesh17/transaction-service
        resources:
          limits:
            memory: "400Mi"
            cpu: "500m"
          requests:
            memory: "200Mi"
            cpu: "200m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: "k8s"
          - name: DB_SERVICE
            valueFrom:
              configMapKeyRef:
                name: my-config
                key: TRANSACTION_DB_SERVICE
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: TRANSACTION_DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: TRANSACTION_DB_PASSWORD
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: TRANSACTION_DB_NAME
        ports:
        - containerPort: 9002
