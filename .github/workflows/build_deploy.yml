name: SpringBoot CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # =========================
  # BUILD JOB (using Jib)
  # =========================
  Build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - config-server
          - bank-service
          - transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
        working-directory: ${{ matrix.service }}

      - name: Build & Push Image with Jib
        working-directory: ${{ matrix.service }}
        run: |
          ./mvnw clean compile jib:build \
            -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest \
            -DskipTests

  # =========================
  # DEPLOY JOB (to GKE)
  # =========================
  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Mandatory for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Authenticate via OIDC
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          # Use the verified provider string
          workload_identity_provider: 'projects/178831723347/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-sa@kubernetes-9766.iam.gserviceaccount.com'

      # 2. Get GKE Credentials & Fix Auth Plugin issue
      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: 'my-cluster'
          location: 'us-central1' # Adjust to 'us-central1-a' if specific zone
          project_id: 'kubernetes-9766'
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: 'true' # 👈 Fixes the 'plugin not found' error

      # 3. Deploy and trigger rollout
      - name: Deploy to Kubernetes
        run: |
          # Use --validate=false to skip OpenAPI download issues
          kubectl apply -f k8s/ --validate=false

      - name: Restart and Check Rollout
        run: |
          services=("api-gateway" "config-server" "bank-service" "transaction-service")
          for svc in "${services[@]}"; do
            echo "Restarting $svc..."
            kubectl rollout restart deployment $svc
            kubectl rollout status deployment $svc --timeout=90s
          done