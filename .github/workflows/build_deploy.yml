name: SpringBoot CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # =========================
  # BUILD JOB
  # =========================
  Build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - config-server
          - bank-service
          - transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ✅ FIX: Grant execute permission for mvnw
      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
        working-directory: ${{ matrix.service }}

      # ✅ UPDATED: Build Jar and Push Docker Image
      - name: Build & Push Image
        working-directory: ${{ matrix.service }}
        run: |
          ./mvnw clean package -DskipTests
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  # =========================
  # DEPLOY JOB
  # =========================
  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials my-cluster \
            --zone us-central1 \
            --project ${{ secrets.GKE_PROJECT }}

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment api-gateway
          kubectl rollout restart deployment config-server
          kubectl rollout restart deployment bank-service
          kubectl rollout restart deployment transaction-service

      - name: Check rollout
        run: |
          kubectl rollout status deployment api-gateway
          kubectl rollout status deployment config-server
          kubectl rollout status deployment bank-service
          kubectl rollout status deployment transaction-service