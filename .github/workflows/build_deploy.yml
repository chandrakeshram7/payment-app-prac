name: SpringBoot CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # =========================
  # BUILD JOB (using Jib)
  # =========================
  Build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Allows other services to build even if one fails
      matrix:
        service:
          - api-gateway
          - config-server
          - bank-service
          - transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
        working-directory: ${{ matrix.service }}

      # ✅ Jib handles compilation, image building, and pushing in one step
      - name: Build & Push Image with Jib
        working-directory: ${{ matrix.service }}
        run: |
          ./mvnw clean compile jib:build \
            -Djib.to.image=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest \
            -DskipTests

  # =========================
  # DEPLOY JOB (to GKE)
  # =========================
  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Mandatory for OIDC Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Authenticate via OIDC (No keys required)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials my-cluster \
            --zone us-central1 \
            --project ${{ secrets.GKE_PROJECT }}

      # ✅ Deploy and trigger rollout to pull the latest Jib images
      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/

      - name: Restart and Check Rollout
        run: |
          services=("api-gateway" "config-server" "bank-service" "transaction-service")
          for svc in "${services[@]}"; do
            echo "Restarting $svc..."
            kubectl rollout restart deployment $svc
            kubectl rollout status deployment $svc --timeout=90s
          done